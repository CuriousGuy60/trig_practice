<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三角函數題目產生器</title>
    <script src="https://cdn.tailwindcss.com"></script><!--tailwindcss-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.8.1/math.js"></script><!--math.js-->
    <!-- 將原本的改為這個 -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script><!--mathjax-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><!--font-awesome-free-->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="keyboard/style.css">
</head>

<body class="p-4 min-h-screen pb-20">
    <div class="flex flex-col h-full w-full">

        <!-- 2. 題目區 -->
        <div class="mx-auto glass-card p-8 mb-6 text-center relative w-full">
            <!-- 圓形倒數計時器容器 -->
            <div id="timerContainer" class="absolute top-4 left-6 hidden">
                <div class="relative flex items-center justify-center w-[72px] h-[72px]">
                    <!-- SVG 圓形進度條 -->
                    <svg class="w-full h-full transform -rotate-90">
                        <rect width="12" height="18" x="56" y="27" rx="2" ry="2" fill="brown" />
                        <!-- 1. 底圈 -->
                        <circle cx="36" cy="36" r="21.5" stroke="rgb(170,170,170)" fill="transparent" stroke-width="3"
                            opacity="1" />
                        <circle cx="36" cy="36" r="20" stroke="currentColor" stroke-width="0" fill="orange"
                            opacity="0.3" />
                        <!-- 2. 刻度層 (重點！) -->
                        <!-- r=20, 周長約 125.6。設定 dasharray 為 "2 8.46"，代表 2px 實線，8.46px 空白，共 12 刻度 -->
                        <circle cx="36" cy="36" r="18" stroke="brown" stroke-width="4" fill="transparent"
                            stroke-dasharray="2 7.42" stroke-dashoffset="1" class="z-10" />
                        <!-- 3. 進度圈 (紅色) -->
                        <circle id="timerBar" cx="36" cy="36" r="21.5" stroke="rgb(255,0,0)" stroke-width="3"
                            fill="transparent" stroke-dashoffset="0" stroke-dasharray="135.1"
                            class="text-red-500 transition-all linear" />
                    </svg>
                    <!-- 中間數字 -->
                    <span id="timerText" class="absolute text-[16px] font-bold text-red-600">b</span>
                </div>
            </div>
            <!-- 右上角：進度顯示 -->
            <div id="progressCounter"
                class="absolute top-4 right-6 text-xs font-bold bg-blue-100 text-blue-600 px-3 py-1 rounded-full">
                請選擇級數
            </div>
            <!-- 全螢幕按鈕 (新增) -->
            <button onclick="toggleFullScreen()" class="absolute bottom-4 right-6 text-gray-400 hover:text-gray-600 transition-all p-2 active:scale-90" title="全螢幕">
                <i id="fullScreenIcon" class="fa-solid fa-expand"></i>
            </button>
            <span class="text-sm text-gray-400 mb-2 block font-semibold tracking-widest uppercase">Question</span>
            <div id="questionText" class="text-3xl font-bold text-gray-800 math-font leading-relaxed">
                準備好了嗎？
            </div>
            <span id="questionTextAdd" class="text-sm text-gray-400 mb-2 block font-semibold tracking-widest ">推薦點右方按鈕進入全螢幕，體驗更佳</span>
            
        </div>
        <!-- 1. 級數區 -->
        <div id='chooseLvlBox' class="mx-auto mb-4 w-full h-full">//裡面的用js生
            <div class="grid grid-cols-3 items-center gap-2">
                <!-- 1 級 -->
                <div class="flex-1 relative">
                    <div class="flex items-center gap-1">
                        <button onclick="initLevel(1)" id="btn-lvl1"
                            class="lvlbtn w-full py-3 bg-white text-gray-400 border border-gray-200 rounded-xl font-bold active:scale-95 transition shadow-md">1
                            級</button>
                        <button id="lvl1info" onclick="mytogglePopover(event,'p1')" class="text-gray-300 p-1 lvlinfo">
                            <i class="fa-regular fa-circle-question"></i>
                        </button>
                    </div>
                    <div id="p1" class="popover">
                        <p class="font-bold border-b border-gray-600 mb-2 pb-1">1 級範圍</p>
                        <ul class="list-disc ml-4 space-y-1 text-gray-300">
                            <li class="math-font">30°, 45°, 60°</li>
                            <li>sin, cos, tan</li>
                            <li>共 9 題</li>
                        </ul>
                    </div>
                </div>
                <!-- 2 級 (暫無功能) -->
                <div class="flex-1 relative">
                    <div class="flex items-center gap-1">
                        <button onclick="initLevel(2)" id="btn-lvl2"
                            class="lvlbtn w-full py-3 bg-white text-gray-400 border border-gray-200 rounded-xl font-bold active:scale-95 transition shadow-md">2
                            級</button>
                        <button id="lvl2info" onclick="mytogglePopover(event,'p2')" class="text-gray-300 p-1 lvlinfo">
                            <i class="fa-regular fa-circle-question"></i>
                        </button>
                    </div>
                    <div id="p2" class="popover">
                        <p class="font-bold border-b border-gray-600 mb-2 pb-1">2 級範圍</p>
                        <ul class="list-disc ml-4 space-y-1 text-gray-300">
                            <li><span class="math-font">0°≦θ<360°< /span>的所有特殊角</li>
                            <li>sin, cos, tan</li>
                            <li>共 46 題</li>
                        </ul>
                    </div>
                </div>
                <!-- 3 級 (暫無功能) -->
                <div class="flex-1 relative">
                    <div class="flex items-center gap-1">
                        <button onclick="initLevel(3)" id="btn-lvl3"
                            class="lvlbtn w-full py-3 bg-white text-gray-400 border border-gray-200 rounded-xl font-bold active:scale-95 transition shadow-md">3
                            級</button>
                        <button id="lvl3info" onclick="mytogglePopover(event,'p3')" class="text-gray-300 p-1 lvlinfo">
                            <i class="fa-regular fa-circle-question"></i>
                        </button>
                    </div>
                    <div id="p3" class="popover">
                        <p class="font-bold border-b border-gray-600 mb-2 pb-1">3 級範圍</p>
                        <p class="text-gray-300">即將推出：和差角公式與恆等式。</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="ansUIBox" class="flex flex-col mx-auto w-full h-full hidden">
            <!-- 3. 解答框區 -->
            <div id="mathInputWrap" class="flex p-4 mb-4 items-center border-2 border-transparent focus:border-blue-500 focus:outline-none shadow-inner bg-white text-4xl rounded-xl font-medium transition-all w-full h-[15dvh] hidden">
                <div id="mathInput" role="textbox" contenteditable="true" aria-multiline="false" aria-label="答案輸入框" class="mathInput items-center w-full h-full">
                    <span class="virtual-cursor"></span>
                    <span id="answerInput" class="text-gray-400">請用下方鍵盤輸入答案</span>
                </div>
            </div>
            <div id="resultBox"
                class="hidden flex items-center p-4 rounded-xl mb-3 shadow-sm transition-colors h-[15dvh] border">
                <div class="flex items-center gap-3" id = "resultTipBox">
                    <i id="resultIcon" class="fa-solid"></i>
                    <span class="flex items-center">
                        <span id="resultText2" class="font-bold hidden"></span>
                        <span id="resultText" class="font-bold"></span>
                    </span>
                </div>
            </div>
            <!-- 4. 虛擬鍵盤區 -->
            <div id="keyboard" class="flex-1 grid grid-cols-4 gap-2 w-full hidden">
                <!-- 第一排 (1-3, /) -->
                <button onclick="press('1')" class="key-btn">1</button>
                <button onclick="press('2')" class="key-btn">2</button>
                <button onclick="press('3')" class="key-btn">3</button>
                <button onclick="press('fraction')" class="key-btn bg-gray-100 text-blue-600">/</button>

                <!-- 第二排 (4-6, -) -->
                <button onclick="press('4')" class="key-btn">4</button>
                <button onclick="press('5')" class="key-btn">5</button>
                <button onclick="press('6')" class="key-btn">6</button>
                <button onclick="press('-')" class="key-btn bg-gray-100 text-blue-600">-</button>

                <!-- 第三排 (7-9, √) -->
                <button onclick="press('7')" class="key-btn">7</button>
                <button onclick="press('8')" class="key-btn">8</button>
                <button onclick="press('9')" class="key-btn">9</button>
                <button onclick="press('sqrt')" class="key-btn bg-gray-100 text-blue-600">√</button>

                <!-- 第四排 (方向鍵與 0) -->
                <button onclick="press('ArrowLeft')" class="key-btn bg-gray-50 text-gray-600">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button onclick="press('0')" class="key-btn">0</button>
                <button onclick="press('ArrowRight')" class="key-btn bg-gray-50 text-gray-600">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button onclick="press('Backspace')" class="key-btn bg-gray-100 text-red-500">
                    <i class="fa-solid fa-backspace"></i>
                </button>

                <!-- 第五排 (ENTER) -->
                <button onclick="press('Enter')" class="key-btn col-span-4 bg-gray-800 text-white text-lg py-3">ENTER</button>
            </div>
            <!-- 5. 答案與詳解區 -->
            <div id="resultArea" class="hidden grid grid-rows-4 grid-cols-4 gap-2 w-full h-full">
                <div class="row-span-3 col-span-4">

                    <!-- 下半部：說明圖片框 (預設隱藏) -->
                    <div id="detailImageArea" class="hidden mt-4 border-t border-gray-100">
                        <p class="text-xs text-gray-400 mb-2 font-bold uppercase tracking-wider">詳解</p>
                        <img id="explanationImg" alt="解題輔助圖" class="rounded-lg shadow-inner border border-gray-100">
                        <!--<p id="explanationNote" class="mt-2 text-sm text-gray-600 leading-relaxed"></p>-->
                    </div>
                </div>
                <!-- 下一題按鈕 -->
                <div class="col-span-2"></div>
                <button id="nextBtn" onclick="renderQuestion()"
                    class="hidden key-btn col-span-2 bg-red-500 text-white font-bold">
                    下一題 <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>
    </div>
    <!-- 彈窗容器：預設隱藏 (hidden) -->
<div id="customConfirm" class="fixed inset-0 z-[100] flex items-center justify-center hidden">
    <!-- 背景遮罩：毛玻璃效果 -->
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
    
    <!-- 彈窗本體 -->
    <div class="glass-card relative bg-white/90 p-6 rounded-2xl shadow-2xl max-w-sm w-full mx-4 transform transition-all scale-95 opacity-0" id="confirmContent">
        <h3 class="text-xl font-bold text-gray-800 mb-2">確認</h3>
        <p id="confirmMessage" class="text-gray-600 mb-6">這是一條確認訊息。</p>
        
        <div class="flex gap-3 justify-end">
            <button id="confirmCancel" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">取消</button>
            <button id="confirmOk" class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:bg-blue-600 transition-shadow shadow-md">確定</button>
        </div>
    </div>
</div>
    <script src="./keyboard/body.js" defer></script>
    <script src="./body.js" defer></script>

</body>

</html>
